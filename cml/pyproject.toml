[project]
name = "cml"
version = "0.1.0"
description = "The concept memory LM: one typed pipeline, manifests, a run store"
requires-python = ">=3.14"
dependencies = ["torch>=2.0", "numpy>=2.0"]

[project.scripts]
cml = "cml:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["cml.py"]

[tool.ruff]
line-length = 88
